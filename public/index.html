<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#46178f">
  <title>Quest</title>
  <link rel="stylesheet" href="/quest.css">
</head>
<body class="alumno">

  <!-- Entrada -->
  <main class="centro" id="v-entrada">
    <div class="panel">
      <h1 class="logo">Quest</h1>
      <p class="error" id="error" hidden></p>
      <form id="form-entrada" autocomplete="off">
        <label class="campo"><span>Código de la partida</span>
          <input id="in-pin" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="000000" required>
        </label>
        <label class="campo"><span>Tu nombre</span>
          <input id="in-nombre" maxlength="24" placeholder="Nombre (y apellido si hay repetidos)" required>
        </label>
        <label class="campo"><span>Tu clase</span>
          <input id="in-clase" maxlength="16" placeholder="Ej.: 1A, 2B…" required>
        </label>
        <button class="btn grande" type="submit" id="btn-entrar">Entrar</button>
      </form>
      <p class="enlace-pie"><a href="/profesor">Soy profesor</a></p>
    </div>
  </main>

  <!-- Sala de espera -->
  <main class="centro" id="v-lobby" hidden>
    <div class="logo" style="font-size:2.4rem">Quest</div>
    <p class="mensaje-grande">¡Estás dentro, <span id="lobby-nombre"></span>!</p>
    <p class="mensaje-suave">Mira la pantalla de la clase. Esperando a que empiece el juego…</p>
  </main>

  <!-- Pregunta -->
  <section class="juego" id="v-pregunta" hidden>
    <div class="barra"><span id="p-num"></span><span id="p-tiempo"></span></div>
    <div class="tiempo-pista"><i id="p-barra"></i></div>
    <div class="opciones" id="p-opciones"></div>
    <div class="pie">Mira la pantalla y toca el color de tu respuesta</div>
  </section>

  <!-- Respuesta enviada -->
  <section class="pantalla-color neutro" id="v-enviada" hidden>
    <div class="icono">✓</div>
    <p class="mensaje-grande">Respuesta enviada</p>
    <p>Esperando al resto de la clase…</p>
  </section>

  <!-- Resultado de la pregunta -->
  <section class="pantalla-color" id="v-resultado" hidden>
    <div class="icono" id="r-icono"></div>
    <p class="mensaje-grande" id="r-titulo"></p>
    <p id="r-detalle"></p>
    <p id="r-pos" style="font-weight:700"></p>
  </section>

  <!-- Final -->
  <main class="centro" id="v-final" hidden>
    <div class="logo" style="font-size:2.4rem">Quest</div>
    <p class="mensaje-grande">¡Fin del cuestionario!</p>
    <p class="mensaje-grande" id="f-pos"></p>
    <p class="mensaje-suave" id="f-pts"></p>
    <button class="btn" id="btn-otra" style="margin-top:1.5rem">Salir</button>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/alumno.js"></script>
</body>
</html>
